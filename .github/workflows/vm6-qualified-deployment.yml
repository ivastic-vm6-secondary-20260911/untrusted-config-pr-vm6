name: VM6 Qualified Deployment Identity
on:
  pull_request:
    paths:
      - 'vm6-qualified-deployment-positive-v2.txt'
permissions:
  contents: read
  deployments: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Create deployment
        id: dep
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          payload=$(jq -n --arg ref "$SHA" '{ref:$ref,environment:"vm6-qualified-deployment",description:"VM6 explicit GitHub Actions deployment",required_contexts:[],auto_merge:false,transient_environment:true,production_environment:false}')
          id=$(curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/json" -d "$payload" "https://api.github.com/repos/$REPO/deployments" | jq -r '.id')
          test -n "$id" && test "$id" != "null"
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Mark deployment success
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEPLOYMENT_ID: ${{ steps.dep.outputs.id }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/json" -d '{"state":"success","environment":"vm6-qualified-deployment","description":"VM6 explicit GitHub Actions deployment success","auto_inactive":false}' "https://api.github.com/repos/$REPO/deployments/$DEPLOYMENT_ID/statuses"
